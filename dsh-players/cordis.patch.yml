# Bundle patch: 把「主持 agent 为每个玩家开一个只指挥它的子 agent」挂进一个 dsh profile。
#
# 挂载层次：这是一份 **profile bundle**（`package.json` 的 `dsh.bundle.patch`
# 指向本文件）。它不属于任何 agent preset——profile 的包管理器
# （`plugin_manager` 的 `install_bundle` / `dsh plugin install`）把它装进 profile 的
# 依赖，再由 profile 的 cordis.yml 用下面这一行加载；于是 profile 里的每个顶层
# 会话都拿得到 `play_as_<玩家>` 工具，主持 agent 也在其中。
#
# 必须与 `python3 -m ra2agent.mcp --player <名册里的名字> --wake-session <子 agent id>`
# 配合：本插件为每个玩家各起一个这样的服务进程（`args` 由插件按玩家拼好），
# `--wake-session` 指向那个玩家子 agent 的会话 id，所以那一方的唤醒只会投回它自己。
#
# `inheritedServerName` 指向上层（ra2 preset 里 `mcp-ra2` 那一行）的 serverName：
# 子 agent 继承父 preset，也就会继承那一份连默认探针端口的客户端，本插件在子
# agent 建立时按这个名字把它们 deny 掉。部署里确实没有这一层时配成空串。
#
# `playerDeny`（这里没写，用代码里的默认值）是玩家面裁剪名单：名单里的工具对玩家
# 子 agent 既不可见、也调不动。默认已含 bash/pwsh/write/edit、所有能派生新 agent 的
# 入口（subagent*、workflow、ralph、spawn_teammate）与 plugin_manager；名册派生的
# `play_as_*` 会自动并进来。**部署自己新增的派生入口要自己加**（任何一行
# `@deepseek-ai/dsh-tool-subagent` 都能用 toolName 改名）。
- insert:
    - id: ra2-players
      name: '@local/ra2-players'
      config:
        rosterPath: /home/youthz/ra2-agent/config/match.json
        # 建 continuable 子 agent 用的 provider；`spawn` 支持 toolFilter 与 continuable。
        provider: spawn
        mcpCommand: python3
        mcpModule: ra2agent.mcp
        mcpCwd: /home/youthz/ra2-agent
        mcpEnv:
          PYTHONPATH: /home/youthz/ra2-agent/src
        toolCallTimeoutMs: 60000
        inheritedServerName: ra2
